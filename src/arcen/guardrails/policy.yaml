# H-03: declarations must match immutable runtime safety invariants.
# Only the allowlist and numerical bounds may be tightened; weakening
# isolation is rejected during boot, never accepted as a fallback.
schema_version: 1
execution:
  backend: docker
  network: none
  host_mounts: false
  host_process_environment: false
  read_only_rootfs: true
  no_new_privileges: true
  drop_all_capabilities: true
  process_fallback: false
  user: "65534:65534"
  allowed_tools:
    - bash
  max_pids: 128
  max_output_bytes: 262144
workspace:
  mode: input_snapshot
  follow_symlinks: false
  copy_back: false
  max_entries: 10000
  max_file_bytes: 67108864
