# ARCEN — built-in tool manifest (BACKEND-SPEC Part 3).
# v0.1 ships exactly 40 core tools. The registry validates every entry:
# unique names, no mcp.* shadowing, schema generation, Protocol satisfied.

[[tool]]
name = "bash"
module = "arcen.tools.bash"
class = "BashTool"
danger = "sandboxed"

