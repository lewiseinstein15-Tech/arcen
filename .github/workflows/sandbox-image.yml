# Builds and pushes the per-session sandbox image to GHCR on every push
# to main. The pinned tag must match DEFAULT_IMAGE in
# src/arcen/sandbox/runtime.py (ghcr.io/lewiseinstein15-tech/arcen-sandbox:0.1.0).

name: sandbox-image

on:
  push:
    branches: [main]
    paths:
      - "docker/sandbox/**"
      - ".github/workflows/sandbox-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lewiseinstein15-tech/arcen-sandbox
  VERSION: "0.1.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GH_PAT repo secret authorizes this job to git push changes back
          # to the repo (commits made by build steps). Falls back to the
          # default workflow token if the secret is removed.
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GH_PAT carries write:packages — pushes the built image to GHCR.
          # Falls back to the default workflow token if the secret is removed.
          password: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (pinned tag)
        uses: docker/build-push-action@v6
        with:
          context: docker/sandbox
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=arcen-sandbox
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
