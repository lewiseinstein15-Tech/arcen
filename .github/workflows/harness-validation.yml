name: Harness validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-wheel:
    name: Installed wheel (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps . --wheel-dir /tmp/arcen-wheel
          python -m pip install '/tmp/arcen-wheel/arcen-0.1.0-py3-none-any.whl[dev,tui]'
      - name: Verify wheel and documentation
        run: |
          python scripts/check_tui_wheel.py /tmp/arcen-wheel/arcen-0.1.0-py3-none-any.whl
          python scripts/check_tui_docs.py
      - name: Assert package imports from installed wheel
        run: |
          python -c 'import pathlib, arcen, arcen.harness.fusion, arcen.tui.harness_demo; p = pathlib.Path(arcen.__file__).resolve(); root = pathlib.Path("src").resolve(); print("Imported:", p); assert not p.is_relative_to(root), "source checkout shadowed installed wheel"'
      - name: Run selected installed-wheel harness and TUI tests from outside checkout
        run: |
          cd /tmp
          PYTHONPATH="$GITHUB_WORKSPACE/tests" python -m pytest --import-mode=importlib -o addopts='' -q \
            "$GITHUB_WORKSPACE/tests/test_harness_tui_demo.py" \
            "$GITHUB_WORKSPACE/tests/test_harness_fusion.py" \
            "$GITHUB_WORKSPACE/tests/test_harness_portability.py" \
            "$GITHUB_WORKSPACE/tests/test_harness_executor.py" \
            "$GITHUB_WORKSPACE/tests/test_harness_conflict_resolution.py" \
            "$GITHUB_WORKSPACE/tests/test_harness_conflict_cli.py" \
            "$GITHUB_WORKSPACE/tests/test_harness_compose_test_workflow.py" \
            "$GITHUB_WORKSPACE/tests/test_harness_contrast_suggestions.py" \
            "$GITHUB_WORKSPACE/tests/test_harness_reflection_cli.py" \
            "$GITHUB_WORKSPACE/tests/test_harness_experience_editor.py" \
            "$GITHUB_WORKSPACE/tests/test_budget_preflight.py" \
            "$GITHUB_WORKSPACE/tests/test_harness_concurrency.py" \
            "$GITHUB_WORKSPACE/tests/test_harness_parallel_trials.py" \
            "$GITHUB_WORKSPACE/tests/test_durable_trial_slots.py" \
            "$GITHUB_WORKSPACE/tests/test_h17e_docker.py" \
            "$GITHUB_WORKSPACE/tests/test_portability_cli.py" \
            "$GITHUB_WORKSPACE/tests/test_harness_task_screen.py" \
            "$GITHUB_WORKSPACE/tests/test_probe_known_values.py" \
            "$GITHUB_WORKSPACE/tests/test_harness_doctor_aux.py"
      - name: Run test suite without live providers or Docker opt-in
        run: python -m pytest

  docker-isolation:
    name: Real Docker isolation and manual flows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wheel and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev,tui]'
      - name: Build local sandbox image
        run: docker build --tag ghcr.io/lewiseinstein15-tech/arcen-sandbox:0.1.0 docker/sandbox
      - name: Build second local image for portability smoke test
        run: |
          printf 'FROM ghcr.io/lewiseinstein15-tech/arcen-sandbox:0.1.0\nLABEL org.arcen.profile=portability-smoke\n' | docker build --tag arcen-portability-second:local -f - .
          echo "ARCEN_PORTABILITY_IMAGE_A=$(docker image inspect ghcr.io/lewiseinstein15-tech/arcen-sandbox:0.1.0 --format '{{.Id}}')" >> "$GITHUB_ENV"
          echo "ARCEN_PORTABILITY_IMAGE_B=$(docker image inspect arcen-portability-second:local --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Run explicitly enabled real-Docker checks
        env:
          ARCEN_TEST_DOCKER_ISOLATION: "1"
          ARCEN_H12_DOCKER_IMAGE: ghcr.io/lewiseinstein15-tech/arcen-sandbox:0.1.0
        run: |
          test -n "$ARCEN_PORTABILITY_IMAGE_A" && test -n "$ARCEN_PORTABILITY_IMAGE_B"
          test "$ARCEN_PORTABILITY_IMAGE_A" != "$ARCEN_PORTABILITY_IMAGE_B"
          python -m pytest -q \
            tests/test_h12_docker.py tests/test_h12c_docker.py tests/test_h12d_docker.py tests/test_h17e_docker.py tests/test_durable_trial_slots.py tests/test_harness_portability.py tests/test_turn_isolation.py tests/test_probe_container.py tests/test_headless.py \
            tests/test_probe_execution.py tests/test_harness_comparison.py \
            tests/test_manual_campaign.py tests/test_campaign_journal.py \
            tests/test_harness_budget.py tests/test_durable_budget.py \
            tests/test_manual_cli.py tests/test_harness_canary.py
