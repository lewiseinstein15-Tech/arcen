[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcen"
version = "0.1.0"
description = "Agentic reasoning. Code. Engineer. An agentic engineer that plans, builds, and verifies — narrated on a live NDJSON stream."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "lewiseinstein15-Tech" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "litellm>=1.50",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "docker>=7.1",
]
mcp = [
    "mcp>=1.0,<2",
]  # kept for back-compat — the SDK is a core dependency since the hermetic-MCP fix
sandbox = [
    "docker>=7.1",
]

[project.scripts]
arcen = "arcen.server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arcen"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "scripts/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
